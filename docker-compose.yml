services:
  api:
    build: 
      context: .
      dockerfile: docker/Dockerfile.api 
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data 
  
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend 
    ports:
    - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./data:/app/data 
  

  